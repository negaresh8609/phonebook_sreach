# نام این گردش کار که در تب Actions گیت‌هاب نمایش داده می‌شود
name: Build Flutter Android APK

# این بخش مشخص می‌کند که چه زمانی این گردش کار اجرا شود
on:
  # این گردش کار را می‌توان به صورت دستی از تب Actions اجرا کرد
  workflow_dispatch:

# تعریف وظایفی که باید انجام شوند
jobs:
  build:
    # مشخص کردن سیستم‌عامل ماشین مجازی (آخرین نسخه اوبونتو)
    runs-on: ubuntu-latest

    # مراحل اجرای وظیفه
    steps:
      # مرحله 1: دانلود (Checkout) کد شما از مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # مرحله 2: نصب و راه‌اندازی Java (مورد نیاز برای اندروید)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # مرحله 3: نصب و راه‌اندازی فلاتر
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # می‌توانید نسخه فلاتر را مشخص کنید یا 'stable' را برای آخرین نسخه پایدار قرار دهید
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true # کش کردن برای افزایش سرعت بیلدهای بعدی

      # مرحله 4: نصب پکیج‌های پروژه
      - name: Install dependencies
        run: flutter pub get

      # مرحله 5: ساخت فایل APK (نسخه Debug برای تست)
      # برای نسخه نهایی (Release)، باید Keystore و امضای دیجیتال را پیکربندی کنید که پیچیده‌تر است.
      # برای شروع، بیلد Debug کافی و عالی است.
      - name: Build APK
        run: flutter build apk --debug

      # مرحله 6: آپلود فایل APK ساخته شده به عنوان "آرتیفکت"
      # این کار باعث می‌شود فایل APK قابل دانلود باشد.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # نامی که برای فایل‌های آپلود شده نمایش داده می‌شود
          name: debug-apk
          # مسیری که فایل APK در آن ساخته شده است
          path: build/app/outputs/flutter-apk/app-debug.apk
