// Path: android/settings.gradle
// محتوای مورد انتظار

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        // این بخش حیاتی است و باید وجود داشته باشد
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // این بخش هم برای وابستگی‌ها لازم است
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
    }
}

rootProject.name = "android"
include ':app'
