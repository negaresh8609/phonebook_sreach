pluginManagement {
    // ۱. بارگذاری Flutter Gradle Plugin از داخل SDK
    def flutterSdkPath = new Properties().withInputStream(file("local.properties").newInputStream()) { props ->
        props.load(it)
        return props.getProperty("flutter.sdk")
    }
    // این دستور باعث می‌شود تا pluginManagement از سورس لوکال Flutter استفاده کند
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    // ۲. مخازن لازم برای یافتن پلاگین‌ها
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// ۳. تعریف نسخه‌های پلاگین‌ها برای Plugin DSL
plugins {
    id "com.android.application" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.0" apply false
    id "io.flutter.gradle" version "0.13.0" apply false
}

rootProject.name = "phonebook_sreach"
include ":app"
