// android/settings.gradle

pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven {
            name = "FlutterEngineArtifacts"
            url  = uri(System.getenv("FLUTTER_ROOT") + "/bin/cache/artifacts/engine/gradle")
        }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "io.flutter.gradle") {
                // مطابق نام JAR موجود در engine/gradle/
                // فرض بر این است که فایل JAR به‌صورت
                // flutter-gradle-plugin-<version>.jar وجود دارد
                useModule("io.flutter:flutter-gradle-plugin:${requested.version}")
            }
        }
    }
}

rootProject.name = "phonebook_sreach"
include ":app"
