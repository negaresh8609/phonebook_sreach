pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        // مخزن پلاگین‌های Flutter در داخل Flutter SDK
        maven {
            name = "FlutterEngineArtifacts"
            url  = uri("${System.getenv("FLUTTER_ROOT")}/bin/cache/artifacts/engine/gradle")
        }
    }
    resolutionStrategy {
        eachPlugin {
            // نگاشت Plugin ID به ماژول داخل Flutter SDK
            if (requested.id.id == "io.flutter.gradle") {
                useModule("io.flutter:flutter-gradle-plugin:${requested.version}")
            }
        }
    }
}

rootProject.name = "phonebook_sreach"
include ":app"
