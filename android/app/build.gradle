// Path: android/app/build.gradle
import java.util.Properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// ۲. استخراج مسیر Flutter SDK
def flutterSdkPath = localProperties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    throw new GradleException("Could not find 'flutter.sdk' in local.properties.")
}

// ۳. بارگذاری اسکریپت flutter.gradle
apply from: "$flutterSdkPath/packages/flutter_tools/gradle/flutter.gradle"

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// خواندن متغیر flutterRoot از local.properties
def flutterRoot = localProperties.getProperty('flutter.sdk')
// بارگذاری flutter.gradle از داخل خود SDK
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.example.phonebook_sreach"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.phonebook_sreach"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // اگر نیاز به امضاء دارید اینجا می‌توانید تنظیم کنید
            // signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"
    // سایر وابستگی‌ها...
}
