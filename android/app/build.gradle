plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withReader("UTF-8") { r -> localProps.load(r) }
}

def versionCode = localProps.getProperty("flutter.versionCode")?.toInteger() ?: 1
def versionName = localProps.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.example.phonebook_sreach"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId "com.example.phonebook_sreach"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        this.versionCode versionCode
        this.versionName versionName
    }

    signingConfigs {
        release {
            def keyFile = rootProject.file("key.properties")
            if (keyFile.exists()) {
                def keyProps = new Properties()
                keyProps.load(new FileInputStream(keyFile))
                storeFile file(keyProps.storeFile)
                storePassword keyProps.storePassword
                keyAlias keyProps.keyAlias
                keyPassword keyProps.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.10.1"
    // سایر وابستگی‌ها…
}
