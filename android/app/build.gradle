plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'io.flutter.gradle'
}

android {
    namespace   "com.example.phonebook_sreach"
    compileSdk  34

    defaultConfig {
        applicationId "com.example.phonebook_sreach"
        minSdk         21
        targetSdk      34
        versionCode    1
        versionName    "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            // اگر نیاز به ProGuard/R8 دارید اینجا تنظیم کنید
            minifyEnabled   false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"
   
}
